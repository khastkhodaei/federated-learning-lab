# ==============================================================================
# FEDERATED LEARNING LAB - UNIFIED EXPERIMENT CONFIGURATION
# Single Source of Truth for Central Coordinator, Client Nodes, and Baselines.
# ==============================================================================

# Global Experiment Settings (Shared Across All Baselines)
experiment_name: "cifar10_federated"
algorithm: "fedavg"
baseline: "fedavg"
num_clients: 3
rounds: 50
epochs: 1
device: "cuda"
seed: 42
server_host: "127.0.0.1"
server_port: 50051

# Dataset & Partitioning
dataset:
  name: "cifar10"
  partition: "dirichlet"
  alpha: 0.1
  batch_size: 32
  data_dir: "./data"
  val_ratio: 0.2

# Neural Network Architecture
model:
  name: "simple_cnn"
  seed: 42

# Local Client Optimization
training:
  learning_rate: 0.01
  loss: "cross_entropy"
  optimizer:
    name: "sgd"
    momentum: 0.9
    weight_decay: 0.0001

# Baseline-Specific Hyperparameter Registry
baselines:
  fedavg: {}
  fedprox:
    mu: 0.01
  ditto:
    lambda_penalty: 0.1
    personalized_epochs: 1
  perfedavg:
    alpha_lr: 0.01
    beta_lr: 0.005
  scaffold: {}
  pdfl:
    similarity_threshold: 0.5
