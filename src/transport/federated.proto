syntax = "proto3";

package federated;

// Service hosted by the central coordinator/server
service FederatedService {
  rpc RegisterNode (RegisterRequest) returns (RegisterResponse);
  rpc SubmitUpdate (UpdateRequest) returns (UpdateResponse);
}

// Service hosted by each Node (Client or Peer)
service NodeService {
  rpc TrainRound (TrainRequest) returns (TrainResponse);
}

message RegisterRequest {
  string node_id = 1;
  string address = 2;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message UpdateRequest {
  string node_id = 1;
  int32 num_samples = 2;
  bytes weights = 3;
}

message UpdateResponse {
  bool success = 1;
  string message = 2;
}

message TrainRequest {
  int32 round_id = 1;
  bytes weights = 2;
  int32 epochs = 3;
}

message TrainResponse {
  string node_id = 1;
  int32 num_samples = 2;
  bytes weights = 3;
  bool success = 4;
  string message = 5;
}
